# meditrack-ai/docker-compose.yml

version: '3.8'

services:
  # ============================================
  # SERVICE PRINCIPAL - API MEDITRACK
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meditrack-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=False
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev-api-key}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - CACHE_TTL=3600
      - MAX_MEASURES_FOR_ANALYSIS=100
    volumes:
      # Persistance des logs
      - ./logs:/app/logs
      # Persistance des données
      - ./data:/app/data
    networks:
      - meditrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # SERVICE REDIS (Optionnel - pour le cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meditrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meditrack-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # SERVICE NGINX (Optionnel - Reverse Proxy)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: meditrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - meditrack-network
    profiles:
      - production

# ============================================
# VOLUMES
# ============================================
volumes:
  redis-data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  meditrack-network:
    driver: bridge