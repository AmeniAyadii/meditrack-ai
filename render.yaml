# meditrack-ai/render.yaml

services:
  - type: web
    name: meditrack-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: API_DEBUG
        value: False
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8   # Force la version Python pour éviter les incompatibilités